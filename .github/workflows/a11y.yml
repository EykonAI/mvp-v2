name: a11y

# First CI workflow in this repo. Scoped deliberately narrow: it runs the
# accessibility gates only, in seconds, with no install step, so it is
# cheap enough that nobody has a reason to skip it.
#
# It exists because PRs #406 and #407 fixed contrast across 281 call
# sites and gave 21 visualisations accessible names — and nothing
# prevented the next commit undoing either.

on:
  pull_request:
    paths:
      - 'apps/web/app/globals.css'
      - 'apps/web/components/**'
      - 'apps/web/app/**'
      # lib/** and the whole scripts/ tree: the source gates below now
      # read lib/anthropic.ts, lib/tool-executor.ts and lib/marketing/*,
      # and a gate that does not run on the file it guards is not a gate.
      # The tool-count drift this catches originates in lib/, which was
      # outside this filter.
      - 'apps/web/lib/**'
      - 'apps/web/scripts/**'
      - '.github/workflows/a11y.yml'
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No npm install: the gates use Node built-ins only, by design.
      - name: Text contrast (hard gate — WCAG 2.2 AA)
        working-directory: apps/web
        run: node scripts/a11y/check-contrast.mjs
      - name: Signal palette separation (ratchet)
        working-directory: apps/web
        run: node scripts/a11y/check-palette.mjs
      - name: Structural budgets (ratchet)
        working-directory: apps/web
        run: node scripts/a11y/check-budgets.mjs
      # An unverified craft rule may never block a draft. Same job
      # because it is the same shape: Node built-ins, no install,
      # seconds to run.
      - name: X codex invariants (hard gate)
        working-directory: apps/web
        run: node scripts/copy/check-codex.mjs
      # The harm register must never be gated on severity again.
      - name: Harm register gate (hard gate)
        working-directory: apps/web
        run: node scripts/copy/check-harm-gate.mjs
      # The public analyst tool count has been wrong in both directions
      # (#441 overcount, then query_dark_contact_events made it an
      # undercount). Asserts platform-stats matches the wired tool set,
      # and that no surface hardcodes a second copy of the number.
      - name: Analyst tool count (hard gate)
        working-directory: apps/web
        run: node scripts/marketing/check-tool-count.mjs

  # DOM-level check. Separate job because it needs a build, a server and a
  # browser — the source gates above stay fast so PR feedback stays fast.
  #
  # Public routes only. The authenticated surfaces need .env.local and a
  # session, so they cannot run unattended here; run `npm run a11y:dom:app`
  # locally against a dev server before shipping UI work.
  dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      - name: Start server
        working-directory: apps/web
        run: |
          npx next start -p 3100 &
          npx wait-on http://localhost:3100 -t 60000
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      - name: DOM accessibility check (public routes)
        working-directory: apps/web
        run: node scripts/a11y/check-dom.mjs
        env:
          A11Y_BASE_URL: http://localhost:3100
